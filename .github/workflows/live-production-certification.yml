name: Phase 6.1 — Live Production Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-1-live-production-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOS_PRODUCTION_URL: ${{ vars.HOS_PRODUCTION_URL }}
      EXECUTION_OS_PRODUCTION_URL: ${{ vars.EXECUTION_OS_PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production dependency audit
        run: bun run audit:production

      - name: Validate live-certifier source
        run: node --check scripts/live-production-certification.mjs

      - name: Read-only live HOS ↔ Execution OS certification
        run: bun run certify:live
